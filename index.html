<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Hagia Sophia — A Hill Above the Bosphorus</title>
  <meta name="description" content="A procedural Three.js study of Hagia Sophia on a hill above the sea at blue hour." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2313192b'/%3E%3Cpath d='M12 44h40v6H12zM18 44V29c0-8 6-14 14-14s14 6 14 14v15z' fill='%23d8c49f'/%3E%3Cpath d='M30 15h4v8h-4z' fill='%23e8b07a'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <div class="grain"></div>
    <div class="vignette"></div>

    <header class="hud">
      <div class="eyebrow">ISTANBUL · BLUE HOUR</div>
      <h1>Hagia<br /><em>Sophia</em></h1>
      <p class="sub">A hill above the Bosphorus<br />procedural light &amp; stone study</p>
    </header>

    <div class="meta">
      <span>41°00′N · 28°58′E</span>
      <span>TWILIGHT / 2026</span>
    </div>

    <nav class="views" aria-label="Camera views">
      <button class="view active" data-view="hero">Hero</button>
      <button class="view" data-view="front">Front</button>
      <button class="view" data-view="east">East</button>
      <button class="view" data-view="low">Waterline</button>
    </nav>

    <div class="hint">
      <span class="dot"></span>
      drag to orbit&nbsp;&nbsp;·&nbsp;&nbsp;scroll to zoom&nbsp;&nbsp;·&nbsp;&nbsp;right-drag to pan
    </div>

    <div class="credit">THREE.JS · PROCEDURAL SCENE</div>

    <div id="loader">
      <div class="loader-inner">
        <div class="loader-eyebrow">ISTANBUL · 41°00′N</div>
        <div class="loader-title">Hagia Sophia</div>
        <div class="loader-line"><i id="bar"></i></div>
        <div class="loader-status" id="status">assembling stone &amp; sea…</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
